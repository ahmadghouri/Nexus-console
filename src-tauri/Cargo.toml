[package]
name = "nexus-console"
version = "0.1.0"
description = "Nexus Console — a lightweight GUI for local dev services"
authors = ["xDAnkit <xDAnkitjain@gmail.com>"]
license = "MIT"
edition = "2021"

[lib]
name = "nexus_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
thiserror = "2"
portable-pty = "0.9.0"
tauri-plugin-notification = "2.3.3"
# bundled: compiles its own sqlite3 — read-only probes + VACUUM on VSCode's
# state.vscdb must not depend on a system libsqlite version.
rusqlite = { version = "0.32", features = ["bundled"] }
# Native confirm dialogs for destructive ops — the gate lives in Rust, so the
# frontend can't bypass it.
tauri-plugin-dialog = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
# Direct Win32 calls (SCM, IP Helper, psapi, registry) — no shelling out to
# sc.exe/netstat/powershell for core reads, so there is no command-injection
# surface and output parsing can't break on locale.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
